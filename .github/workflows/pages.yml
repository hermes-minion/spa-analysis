name: Deploy a GitHub Pages

# El sitio vive en 009540/web (la raíz del repo es el directorio de trabajo ~/stocks).
# Pages publica ese subdirectorio como raíz del sitio: /, /analyses.json, /reports/<TICKER>.html

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: activa Pages (Source = GitHub Actions) la primera vez sin tocar ajustes
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 009540/web

      - id: deployment
        uses: actions/deploy-pages@v4
